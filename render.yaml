# Free-tier teaching deploy. Maps to the same app you run in Docker locally.
# Free web services sleep after 15 minutes; free Postgres expires after 30 days.
services:
  - type: web
    name: shipment-visibility
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipment-visibility-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: DELAY_CHECK_MINUTES
        value: "5"

databases:
  - name: shipment-visibility-db
    plan: free
    databaseName: shipvis
    user: shipvis
